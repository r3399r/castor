  LambdaApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      Architectures: [arm64]
      Handler: index.api
      Runtime: nodejs22.x
      FunctionName: !Sub ${Project}-${TargetEnvr}-api
      Role: !GetAtt ExecutionRole.Arn
      CodeUri: ../../dist
      MemorySize: 512
      Environment:
        Variables:
          ENVR: !Sub ${TargetEnvr}
          PROJECT: !Sub ${Project}
          DB_HOST:
            Fn::ImportValue: !Sub celestial-studio-${TargetEnvr}-db-endpoint
          DB_PWD: !Sub '{{resolve:ssm:mysql-${TargetEnvr}-${Project}-pwd}}'
          LOGGER_QUEUE_URL: !Sub https://sqs.ap-east-2.amazonaws.com/${AWS::AccountId}/polaris-${TargetEnvr}-logger-queue
          FB_PAGE_ID: '352343371286540'
          FB_ACCESS_TOKEN: !Sub '{{resolve:ssm:${Project}-fb-access-token}}'
          FIREBAE_ADMIN_KEY: !Sub '{{resolve:ssm:${Project}-firebase-admin-key}}'
  InvokePermissionLambdaApi:
    Type: AWS::Lambda::Permission
    DependsOn: [ServerlessApi, LambdaApiFunction]
    Properties:
      FunctionName: !Sub ${Project}-${TargetEnvr}-api
      Action: 'lambda:InvokeFunction'
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ServerlessApi}/*
