              },
              "required": ["name"]
            },
            "postSubject": {
              "type": "object",
              "properties": {
                "name":{"type": "string"}
              },
              "required": ["name"]
            },
            "postExam": {
              "type": "object",
              "properties": {
                "subjectId":{"type": "number"},
                "name":{"type": "string"}
              },
              "required": ["subjectId","name"]
            },
            "postQuestion": {
              "type": "object",
              "properties": {
                "subjectId":{"type": "number"},
                "type":{"type": "string", "enum": ["GROUP","SINGLE","MULTIPLE","TRUE_FALSE","FILL"]},
                "imageUrl":{"type": "string"},
                "content":{"type": "string"},
                "options": {"type": "string",nullable: true},
                "answer": {"type": "string",nullable: true},
                "difficulty":{"type": "integer", "minimum": 1, "maximum": 10},
                "examId":{"type": "number"},
                "tagIds": {
                  "type": "array",
                  "items": {"type": "number"}
                },
                "conceptIds": {
                  "type": "array",
                  "items": {"type": "number"}
                },
                "childQuestions": {
                  "type": "array",
                  "items": {
                    "type": "object",
                    "properties": {
                      "type": {"type": "string", enum: ["SINGLE","MULTIPLE","TRUE_FALSE","FILL"]},
                      "sortOrder": {"type": "integer", "minimum": 0},
                      "content": {"type":"string"},
                      "options": {"type": "string"},
                      "answer": {"type": "string"},
                      "difficulty":{"type": "integer", "minimum": 1, "maximum": 10}
                    },
                    "required": ["type","sortOrder","content","options","answer","difficulty"]
                  }
                }
              },
              "required": ["subjectId","type","imageUrl","difficulty","examId","conceptIds"]
            },
            "postConceptGroup": {
              "type": "object",
              "properties": {
                "subjectId":{"type": "number"},
                "name":{"type": "string"}
              },
              "required": ["subjectId","name"]
            },
            "postConcept": {
              "type": "object",
              "properties": {
                "conceptGroupId":{"type": "number"},
                "name":{"type": "string"}
              },
              "required": ["conceptGroupId","name"]
            },
            "postTag": {
              "type": "object",
              "properties": {
                "subjectId":{"type": "number"},
                "name":{"type": "string"}
              },
              "required": ["subjectId","name"]
            },
            "postReply": {
              "type": "array",
              "items": {
                "type": "object",
                "properties": {
                  "questionId": {"type":"number"},
                  "repliedAnswer": {"type": "string"}
                },
                "required": ["questionId","repliedAnswer"]
              }
