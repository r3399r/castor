services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: castor
      MYSQL_USER: castor
      MYSQL_PASSWORD: castorlocal
    ports:
      - '3306:3306'
    volumes:
      - castor_mysql_data:/var/lib/mysql
      - ../db/table/category.sql:/docker-entrypoint-initdb.d/01_category.sql:ro
      - ../db/table/subject.sql:/docker-entrypoint-initdb.d/02_subject.sql:ro
      - ../db/table/subject_category.sql:/docker-entrypoint-initdb.d/03_subject_category.sql:ro
      - ../db/table/exam.sql:/docker-entrypoint-initdb.d/04_exam.sql:ro
      - ../db/table/exam_subject.sql:/docker-entrypoint-initdb.d/05_exam_subject.sql:ro
      - ../db/table/tag.sql:/docker-entrypoint-initdb.d/06_tag.sql:ro
      - ../db/table/concept_group.sql:/docker-entrypoint-initdb.d/07_concept_group.sql:ro
      - ../db/table/concept.sql:/docker-entrypoint-initdb.d/08_concept.sql:ro
      - ../db/table/user.sql:/docker-entrypoint-initdb.d/09_user.sql:ro
      - ../db/table/filter_dimension.sql:/docker-entrypoint-initdb.d/10_filter_dimension.sql:ro
      - ../db/table/filter_option.sql:/docker-entrypoint-initdb.d/11_filter_option.sql:ro
      - ../db/table/filter_subject_option.sql:/docker-entrypoint-initdb.d/12_filter_subject_option.sql:ro
      - ../db/table/question.sql:/docker-entrypoint-initdb.d/13_question.sql:ro
      - ../db/table/question_tag.sql:/docker-entrypoint-initdb.d/14_question_tag.sql:ro
      - ../db/table/question_concept.sql:/docker-entrypoint-initdb.d/15_question_concept.sql:ro
      - ../db/table/question_exam.sql:/docker-entrypoint-initdb.d/16_question_exam.sql:ro
      - ../db/table/pending_reply.sql:/docker-entrypoint-initdb.d/17_pending_reply.sql:ro
      - ../db/table/reply.sql:/docker-entrypoint-initdb.d/18_reply.sql:ro
      - ../db/table/user_concept_stat.sql:/docker-entrypoint-initdb.d/19_user_concept_stat.sql:ro
      - ../db/table/user_stat_history.sql:/docker-entrypoint-initdb.d/20_user_stat_history.sql:ro
      - ../db/table/user_wrong_question.sql:/docker-entrypoint-initdb.d/21_user_wrong_question.sql:ro
      - ../db/table/point_transaction.sql:/docker-entrypoint-initdb.d/22_point_transaction.sql:ro
      - ../db/table/duration_global_stat.sql:/docker-entrypoint-initdb.d/23_duration_global_stat.sql:ro
      - ../db/table/user_subscription.sql:/docker-entrypoint-initdb.d/24_user_subscription.sql:ro
      # After user (09), because user_guardian's foreign keys need both it
      # and guardian to exist.
      - ../db/table/guardian.sql:/docker-entrypoint-initdb.d/25_guardian.sql:ro
      - ../db/table/user_guardian.sql:/docker-entrypoint-initdb.d/26_user_guardian.sql:ro
      # payment_charge's foreign key needs payment_order, which in turn
      # needs user (09), so the two stay in this order.
      - ../db/table/payment_order.sql:/docker-entrypoint-initdb.d/27_payment_order.sql:ro
      - ../db/table/payment_charge.sql:/docker-entrypoint-initdb.d/28_payment_charge.sql:ro
      # The donation feature. charity_organization_guardian needs guardian
      # (25), donation needs user (09), user_guardian (26) and the batch
      # table, so this whole block has to stay after those and in order.
      - ../db/table/charity_organization.sql:/docker-entrypoint-initdb.d/29_charity_organization.sql:ro
      - ../db/table/charity_organization_guardian.sql:/docker-entrypoint-initdb.d/30_charity_organization_guardian.sql:ro
      - ../db/table/donation_batch.sql:/docker-entrypoint-initdb.d/31_donation_batch.sql:ro
      - ../db/table/donation_batch_evidence.sql:/docker-entrypoint-initdb.d/32_donation_batch_evidence.sql:ro
      - ../db/table/donation.sql:/docker-entrypoint-initdb.d/33_donation.sql:ro
      # Seed data, numbered 9x so it lands after every table above --
      # docker-entrypoint-initdb.d runs files in name order, and these
      # insert into tables created there. Without the guardians, /box shows
      # an empty store on a fresh volume, which reads as a broken page
      # rather than as missing seed data. Regression tests clear these
      # tables before their first case, so the rows do not affect them.
      - ../db/script/v1.0.0/insert_category.sql:/docker-entrypoint-initdb.d/90_insert_category.sql:ro
      - ../db/script/v1.0.0/insert_guardian.sql:/docker-entrypoint-initdb.d/91_insert_guardian.sql:ro
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-u', 'root', '-proot']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  castor_mysql_data:
