AWSTemplateFormatVersion: '2010-09-09'
Transform: "AWS::Serverless-2016-10-31"
Description: castor deployment cloudformation script

Globals:
  Function:
    Timeout: 30

Parameters:
  Project:
    Type: String
  TargetEnvr:
    Type: String
    Description: The target environment for API Gateway deployment.
  SubDomain:
    Type: String
  Domain:
    Type: String

Conditions: 
  IsProd: !Equals [ !Ref TargetEnvr, prod ]

Resources:
  #####################################################################
  ##### Execution role scoped to this function only. Add narrowly  #####
  ##### -scoped inline policies here as this function actually     #####
  ##### needs them (e.g. sqs:SendMessage on one queue ARN) instead  #####
  ##### of reusing a broad *FullAccess role shared across unrelated #####
  ##### functions (housekeep, facebook, ...).                       #####
  #####################################################################
  ApiExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${Project}-${TargetEnvr}-api-execution-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        # POST /question calls events:EnableRule on the Facebook auto-post
        # rule after creating a question, to arm it -- only EnableRule,
        # not DisableRule; that half only ever runs from FacebookFunction
        # (see FacebookExecutionRole) once it runs out of questions to post.
        - PolicyName: !Sub ${Project}-${TargetEnvr}-api-policy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - events:EnableRule
                Resource: !Sub arn:aws:events:${AWS::Region}:${AWS::AccountId}:rule/${Project}-${TargetEnvr}-facebook
              # Same shared logging queue the legacy backend and spica write
              # request logs to -- "polaris" is that shared pipeline's own
              # project name, not this stack's, so it's not ${Project}.
              - Effect: Allow
                Action:
                  - sqs:SendMessage
                Resource: !Sub arn:aws:sqs:${AWS::Region}:${AWS::AccountId}:polaris-${TargetEnvr}-logger-queue

  RestApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: !Sub ${TargetEnvr}
      EndpointConfiguration: REGIONAL

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      Architectures: [arm64]
      Handler: index.api
      Runtime: nodejs22.x
      FunctionName: !Sub ${Project}-${TargetEnvr}-api
      Role: !GetAtt ApiExecutionRole.Arn
      # Own bundle, deliberately separate from FacebookFunction's --
      # they used to share dist/index.js, which meant this function's
      # cold start had to load facebook.ts's require('@sparticuz/chromium')
      # too. That package is `--external` (provided only by
      # FacebookFunction's Chromium layer), so loading it here without
      # the layer attached threw ImportModuleError on every invocation.
      CodeUri: ../../dist/api
      MemorySize: 256
      Timeout: 30
      Environment:
        Variables:
          ENVR: !Sub ${TargetEnvr}
          PROJECT: !Sub ${Project}
          DB_HOST:
            Fn::ImportValue: !Sub celestial-studio-${TargetEnvr}-db-endpoint
          DB_PWD: !Sub '{{resolve:ssm:mysql-${TargetEnvr}-${Project}-pwd}}'
          DB_POOL_SIZE: '2'
          FIREBASE_ADMIN_KEY: !Sub '{{resolve:ssm:${Project}-firebase-admin-key}}'
          LOGGER_QUEUE_URL: !Sub https://sqs.${AWS::Region}.amazonaws.com/${AWS::AccountId}/polaris-${TargetEnvr}-logger-queue
      Events:
        AnyRoute:
          Type: Api
          Properties:
            RestApiId: !Ref RestApi
            Path: /{proxy+}
            Method: ANY

  #####################################################################
  ##### Facebook auto-post: polls for the oldest question that has  #####
  ##### content but hasn't been posted yet, renders it to an image   #####
  ##### via headless Chromium, and posts it to the FB page. Runs on  #####
  ##### its own EventBridge schedule rather than every-request like  #####
  ##### the API function -- disarms itself (State: DISABLED here,    #####
  ##### then events:DisableRule when it runs dry) so it isn't        #####
  ##### polling every 10 minutes with nothing to do; POST /question  #####
  ##### re-arms it via events:EnableRule after creating a question.   #####
  #####################################################################
  FacebookExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${Project}-${TargetEnvr}-facebook-execution-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: !Sub ${Project}-${TargetEnvr}-facebook-policy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:DeleteObject
                Resource: !Sub arn:aws:s3:::${Project}-public-bucket/*
              - Effect: Allow
                Action:
                  - events:EnableRule
                  - events:DisableRule
                # Built from the rule's predictable name rather than
                # !GetAtt EventBridgeFacebook.Arn -- that would make this
                # role depend on the rule, the rule's Target depends on
                # FacebookFunction, and FacebookFunction's Role depends
                # back on this role, a circular dependency CloudFormation
                # refuses to deploy.
                Resource: !Sub arn:aws:events:${AWS::Region}:${AWS::AccountId}:rule/${Project}-${TargetEnvr}-facebook

  ChromiumLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: !Sub ${Project}-${TargetEnvr}-chromium
      ContentUri: ../../chromium-arm64.zip
      CompatibleRuntimes:
        - nodejs22.x
      CompatibleArchitectures:
        - arm64
      RetentionPolicy: Delete

  FacebookFunction:
    Type: AWS::Serverless::Function
    Properties:
      Architectures: [arm64]
      Handler: index.facebook
      Runtime: nodejs22.x
      FunctionName: !Sub ${Project}-${TargetEnvr}-facebook
      Role: !GetAtt FacebookExecutionRole.Arn
      CodeUri: ../../dist/facebook
      MemorySize: 1024
      Timeout: 60
      Layers:
        - !Ref ChromiumLayer
      Environment:
        Variables:
          ENVR: !Sub ${TargetEnvr}
          PROJECT: !Sub ${Project}
          DB_HOST:
            Fn::ImportValue: !Sub celestial-studio-${TargetEnvr}-db-endpoint
          DB_PWD: !Sub '{{resolve:ssm:mysql-${TargetEnvr}-${Project}-pwd}}'
          DB_POOL_SIZE: '1'
          S3_BUCKET: !Sub ${Project}-public-bucket
          FB_PAGE_ID: '352343371286540'
          FB_ACCESS_TOKEN: !Sub '{{resolve:ssm:${Project}-fb-access-token}}'

  InvokePermissionFacebook:
    Type: AWS::Lambda::Permission
    DependsOn: [FacebookFunction]
    Properties:
      FunctionName: !Sub ${Project}-${TargetEnvr}-facebook
      Action: 'lambda:InvokeFunction'
      Principal: events.amazonaws.com
      SourceArn: !GetAtt EventBridgeFacebook.Arn

  EventBridgeFacebook:
    Type: AWS::Events::Rule
    DependsOn: [FacebookFunction]
    Properties:
      Name: !Sub ${Project}-${TargetEnvr}-facebook
      ScheduleExpression: cron(*/10 * * * ? *)
      State: DISABLED
      Targets:
        - Arn: !GetAtt FacebookFunction.Arn
          Id: !Sub ${Project}-${TargetEnvr}-facebook

  #####################################################################
  ##### Daily housekeeping: trims reply/pending_reply so they don't  #####
  ##### grow forever. Runs unconditionally on its own schedule (no    #####
  ##### enable/disable dance like Facebook's) -- just DB access, no   #####
  ##### extra AWS permissions needed beyond basic execution.          #####
  #####################################################################
  HousekeepExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${Project}-${TargetEnvr}-housekeep-execution-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  HousekeepFunction:
    Type: AWS::Serverless::Function
    Properties:
      Architectures: [arm64]
      Handler: index.housekeep
      Runtime: nodejs22.x
      FunctionName: !Sub ${Project}-${TargetEnvr}-housekeep
      Role: !GetAtt HousekeepExecutionRole.Arn
      CodeUri: ../../dist/housekeep
      MemorySize: 256
      Timeout: 30
      Environment:
        Variables:
          ENVR: !Sub ${TargetEnvr}
          PROJECT: !Sub ${Project}
          DB_HOST:
            Fn::ImportValue: !Sub celestial-studio-${TargetEnvr}-db-endpoint
          DB_PWD: !Sub '{{resolve:ssm:mysql-${TargetEnvr}-${Project}-pwd}}'
          DB_POOL_SIZE: '1'

  InvokePermissionHousekeep:
    Type: AWS::Lambda::Permission
    DependsOn: [HousekeepFunction]
    Properties:
      FunctionName: !Sub ${Project}-${TargetEnvr}-housekeep
      Action: 'lambda:InvokeFunction'
      Principal: events.amazonaws.com
      SourceArn: !GetAtt EventBridgeHousekeep.Arn

  EventBridgeHousekeep:
    Type: AWS::Events::Rule
    DependsOn: [HousekeepFunction]
    Properties:
      Name: !Sub ${Project}-${TargetEnvr}-housekeep
      ScheduleExpression: cron(5 20 * * ? *)
      State: ENABLED
      Targets:
        - Arn: !GetAtt HousekeepFunction.Arn
          Id: !Sub ${Project}-${TargetEnvr}-housekeep

  #####################################################################
  ##### Daily question-stat job: recomputes question-level stats     #####
  ##### derived from reply history -- currently just the 5th-        #####
  ##### percentile answer duration (question.duration_p5_ms) from    #####
  ##### reply.duration_ms, named generically since more question-    #####
  ##### level stats are expected to land here over time. cron(0 19   #####
  ##### * * ? *) UTC = 03:00 Taiwan time, same reasoning as           #####
  ##### Housekeep's schedule.                                        #####
  #####################################################################
  QuestionStatExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${Project}-${TargetEnvr}-question-stat-execution-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  QuestionStatFunction:
    Type: AWS::Serverless::Function
    Properties:
      Architectures: [arm64]
      Handler: index.questionStat
      Runtime: nodejs22.x
      FunctionName: !Sub ${Project}-${TargetEnvr}-question-stat
      Role: !GetAtt QuestionStatExecutionRole.Arn
      CodeUri: ../../dist/questionStat
      MemorySize: 256
      Timeout: 60
      Environment:
        Variables:
          ENVR: !Sub ${TargetEnvr}
          PROJECT: !Sub ${Project}
          DB_HOST:
            Fn::ImportValue: !Sub celestial-studio-${TargetEnvr}-db-endpoint
          DB_PWD: !Sub '{{resolve:ssm:mysql-${TargetEnvr}-${Project}-pwd}}'
          DB_POOL_SIZE: '1'

  InvokePermissionQuestionStat:
    Type: AWS::Lambda::Permission
    DependsOn: [QuestionStatFunction]
    Properties:
      FunctionName: !Sub ${Project}-${TargetEnvr}-question-stat
      Action: 'lambda:InvokeFunction'
      Principal: events.amazonaws.com
      SourceArn: !GetAtt EventBridgeQuestionStat.Arn

  EventBridgeQuestionStat:
    Type: AWS::Events::Rule
    DependsOn: [QuestionStatFunction]
    Properties:
      Name: !Sub ${Project}-${TargetEnvr}-question-stat
      ScheduleExpression: cron(0 19 * * ? *)
      State: ENABLED
      Targets:
        - Arn: !GetAtt QuestionStatFunction.Arn
          Id: !Sub ${Project}-${TargetEnvr}-question-stat

  #########################################
  ##### Cloudfront and Route53 config #####
  #########################################
  Route53RecordSet:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneName: !Sub '${Domain}.'
      Name: !If [IsProd, !Sub '${SubDomain}.${Domain}.', !Sub '${SubDomain}-${TargetEnvr}.${Domain}.']
      Type: A
      AliasTarget:
        HostedZoneId: Z2FDTNDATAQYW2
        DNSName: !GetAtt
        - CloudFrontDistribution
        - DomainName
  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    DependsOn: [RestApi, S3Bucket]
    Properties:
      DistributionConfig:
        Aliases: [!If [IsProd, !Sub '${SubDomain}.${Domain}', !Sub '${SubDomain}-${TargetEnvr}.${Domain}']]
        Origins:
        - DomainName: !Select [1, !Split ["//", !GetAtt S3Bucket.WebsiteURL]]
          Id: S3-hosted-website-ID
          CustomOriginConfig:
            OriginProtocolPolicy: http-only
        - DomainName: !Sub '${RestApi}.execute-api.${AWS::Region}.amazonaws.com'
          Id: !Sub ${Project}-${TargetEnvr}-ApiEndpoint-ID
          OriginPath: !Sub /${TargetEnvr}
          CustomOriginConfig:
            HTTPPort: 80
            HTTPSPort: 443
            OriginKeepaliveTimeout: 5
            OriginProtocolPolicy: https-only
        Enabled: 'true'
        HttpVersion: http2
        DefaultRootObject: index.html
        DefaultCacheBehavior:
          AllowedMethods: [ "GET", "HEAD", "OPTIONS", "PUT", "PATCH", "POST", "DELETE"]
          TargetOriginId: S3-hosted-website-ID
          ForwardedValues:
            QueryString: 'false'
            Cookies:
              Forward: none
          ViewerProtocolPolicy: redirect-to-https
          DefaultTTL: 0
          MinTTL: 0
          MaxTTL: 0
        CacheBehaviors:
        - PathPattern: /api/*
          AllowedMethods: [ "GET", "HEAD", "OPTIONS", "PUT", "PATCH", "POST", "DELETE"]
          ForwardedValues:
            Headers: [ "Authorization", "Accept" ]
            QueryString: true
          TargetOriginId: !Sub ${Project}-${TargetEnvr}-ApiEndpoint-ID
          ViewerProtocolPolicy: redirect-to-https
          DefaultTTL: 0
          MinTTL: 0
          MaxTTL: 0
        PriceClass: PriceClass_200
        ViewerCertificate:
          AcmCertificateArn: arn:aws:acm:us-east-1:278497686406:certificate/8914c993-68c7-4e06-b741-def8fc0270ba
          MinimumProtocolVersion: TLSv1
          SslSupportMethod: sni-only
  ####################################
  ##### S3 Bucket and its policy #####
  ####################################
  S3Bucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub ${Project}-${TargetEnvr}-y
      WebsiteConfiguration:
        ErrorDocument: index.html
        IndexDocument: index.html
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false
  S3BucketPolicy:
    Type: AWS::S3::BucketPolicy
    DependsOn: [S3Bucket]
    Properties:
      Bucket: !Ref S3Bucket
      PolicyDocument: !Join
      - ''
      - - '{
            "Version": "2012-10-17",
            "Id": "PolicyForCloudFrontPrivateContent",
            "Statement": [
                {
                    "Sid": "Allow-OAI-Access-To-Bucket",
                    "Effect": "Allow",
                    "Principal": "*",
                    "Action": "s3:GetObject",
                    "Resource": "'
        - !GetAtt S3Bucket.Arn
        - '/*"
                }
            ]
          }'

Outputs:
  ApiEndpoint:
    Value: !Sub https://${RestApi}.execute-api.${AWS::Region}.amazonaws.com/${TargetEnvr}
  CustomDomainEndpoint:
    Value: !If [IsProd, !Sub 'https://${SubDomain}.${Domain}', !Sub 'https://${SubDomain}-${TargetEnvr}.${Domain}']
