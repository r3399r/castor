name: DEV

on:
  push:
    branches: [ dev ]

jobs:
  # Typecheck, unit tests, and the openapi/webapp-types gate. Defined in
  # checks.yml so dev and prod cannot drift apart. `needs` below is what makes
  # a failure here stop the deploy.
  checks:
    uses: ./.github/workflows/checks.yml

  build:
    needs: checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          # The checks job's install does not reach this runner, so deploy.sh
          # installs again here. Caching ~/.npm is what keeps that second
          # install from costing what the first one did.
          cache: npm

      # No install step: deploy.sh runs `npm install` itself before it builds
      # either half.
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ap-east-2
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      # `next build` inlines these, so they have to exist before deploy.sh
      # reaches the webapp half.
      - name: 'Create env file'
        run: |
          cd webapp
          touch .env
          echo NEXT_PUBLIC_FIREBASE_API_KEY=${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }} >> .env
          echo NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }} >> .env
          echo NEXT_PUBLIC_FIREBASE_PROJECT_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }} >> .env
          echo NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }} >> .env
          echo NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }} >> .env
          echo NEXT_PUBLIC_FIREBASE_APP_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }} >> .env
          echo NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID }} >> .env
          # Beta mode. A literal and not a secret: it is 'true' or
          # 'false', and having it in git is the point -- flipping it is a
          # reviewable commit. Its backend twin is BETA_MODE in
          # backend_new/aws/cloudformation/template.yaml and the two are
          # changed in the same commit; see AGENTS.md.
          echo NEXT_PUBLIC_BETA_MODE=false >> .env

      - name: Deploy to dev environment
        run: |
          sh deploy.sh test
