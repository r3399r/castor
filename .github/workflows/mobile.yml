name: Mobile CI

# analyze-and-test runs on every push to dev that touches mobile/ (or on
# demand) so lint/test feedback stays fast. build-android and build-ios are
# gated to workflow_dispatch only (see each job's `if`) -- macOS runners cost
# 10x the Linux runner-minutes on private repos, so we don't want a full
# build firing on every dev commit, just when someone actually wants an
# installable artifact.
on:
  push:
    branches: [dev]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile.yml'
  workflow_dispatch:

concurrency:
  group: mobile-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: mobile

env:
  FLUTTER_VERSION: '3.44.8'

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  build-android:
    needs: analyze-and-test
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: castor-mobile-debug-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk

  build-ios:
    needs: analyze-and-test
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      # --no-codesign because there's no Apple Developer signing set up yet
      # (see mobile/README.md) -- this only proves the app compiles cleanly
      # against real Xcode. The resulting .app is NOT installable on a
      # physical iPad; that needs a signed .ipa, which needs a paid Apple
      # Developer Program membership plus certificates/provisioning
      # profiles wired in as repo secrets.
      - run: flutter build ios --release --no-codesign
